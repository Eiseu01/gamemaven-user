<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/icon-removebg-preview.png">
    <title>About Us</title>
</head>
<style>
    * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        font-family: "Roboto";
    }
    body {
        height: 100vh;
        background-color: #FAFAFA;
    }
    header {
        background-color: #0D0D0D;
        height: 80px;
        width: 100%;
        position: sticky;
        top: 0;
        display: flex;
        align-items: center; 
        justify-content: space-between; 
        padding: 0 20px; 
    }
    nav ul {
        list-style-type: none;
        display: flex;
    }
    nav ul li {
        padding: 0 10px;
    }
    a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        margin-right: 10px;
    }
    img{
        width: 100%;
        height: 50px;
    }
    .logo{
        cursor: pointer;
    }
    main{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin-top: -150px;
    }
    .container div{
        padding: 10px;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 10px;
    }
    .ace{
        display: grid;
        grid-template-columns: 100px 1fr 90px 90px;
        align-items: center;
        text-align: center;
        box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
        border-radius: 10px;
        font-size: 28px;
    }
    .pic{
        width: 70px;
        height: 70px;
        border-radius: 100px;
    }
    .fb{
        transition: 0.4s;
    }
    .fb:hover{
        background-color: rgb(79, 120, 255);
    }
    .insta{
        transition: 0.4s;
    }
    .insta:hover{
        background-color: #E3456B;
    }
</style>
<body>
    <header>
        <div class="logo"><a href="/index.html"><img src="assets/capture.PNG"></a></div>
        <nav>
            <ul>
                <li><a href="/index.html">Home</a></li>

                <li><a href="/singup.html">Sign Up</a></li>
                <li><a href="/aboutvisit.html">About Us</a></li>
            </ul>
        </nav>
    </header>
    <h1 style="text-align: center; padding-top: 40px;">About Us</h1>
    <p style="text-align: center; padding-top: 5px; font-size: 24px;">Initial Project Submission (BSCS-1B)</p>
    <main>
        <div class="container">
            <div class="ace">
                <div><img src="assets/ace.jpg" class="pic"></div>
                <div><p>Ace John Nieva</p></div>
                <div class="fb"><a href="https://www.facebook.com/eiseu.16"><img src="assets/fb.svg" class="pic"></a></div>
                <div class="insta"><a href="https://www.instagram.com/eiseu01"><img src="assets/insta.webp" class="pic"></a></div>
            </div>
            <div class="ace">
                <div><img src="assets/mico.PNG" class="pic"></div>
                <div><p>Carlos Angelo Machutes</p></div>
                <div class="fb"><a href="https://www.facebook.com/mico.machutes"><img src="assets/fb.svg" class="pic"></a></div>
                <div class="insta"><a href="https://www.instagram.com/_mekoii"><img src="assets/insta.webp" class="pic"></a></div>
            </div>
            <div class="ace">
                <div><img src="assets/AA.jpg" class="pic"></div>
                <div><p>Asanul Asanul</p></div>
                <div class="fb"><a href="https://www.facebook.com/asanul.asanul.125"><img src="assets/fb.svg" class="pic"></a></div>
                <div class="insta"><a href="https://www.instagram.com/asanul_ibrhm"><img src="assets/insta.webp" class="pic"></a></div>
            </div>
        </div>
    </main>
    <hr style="margin: 10px;">
    <footer">
      <p style="font-size: 12px; color: black; text-align: center;">© 2024, GameMaven, All Rights Reserved</p>
    </footer>
</body>
</html>
