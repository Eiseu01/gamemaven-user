<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/icon-removebg-preview.png">
    <title>Sign Up</title>
</head>
<style>
    * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        font-family: "Roboto";
    }
    body {
        height: 100vh;
        background-color: #FAFAFA;
    }
    header {
        background-color: #0D0D0D;
        height: 80px;
        width: 100%;
        position: sticky;
        top: 0;
        display: flex;
        align-items: center; 
        justify-content: space-between; 
        padding: 0 20px; 
    }
    nav ul {
        list-style-type: none;
        display: flex;
    }
    nav ul li {
        padding: 0 10px;
    }
    a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        margin-right: 10px;
    }
    img{
        width: 100%;
        height: 50px;
    }
    .logo{
        cursor: pointer;
    }
    main{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .first{
        display: flex;
        justify-content: center;
        flex-direction: column;
        box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
        padding: 30px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 10px;
    }
    h1{
        font-weight: 500;
        display: block;
        margin-bottom: 40px;
    }
    label{
        align-items: left;
        font-size: 18px;
        color: black;
        margin-top: 5px;
    }
    #agree{
        margin-right: 5px;
    }
    input{
        text-align: left;
        border: none;
        background-color: lightgray;
        padding: 10px 5px;
        border-radius: 5px;
        font-size: 18px;
    } 
    button {
        margin-top: 15px;
        padding: 10px 0;
        background-color: #4B0200;
        border: none;
        color: white;
        border-radius: 5px;
        font-size: 20px;
        cursor: pointer;
    }
    .forgot{
        margin-top: 10px;
        font-weight: 500;
    }
    .sign{
        font-weight: 500;
        color: black;
    }
    .not{
        margin-top: 50px;
        font-size: 24px;
        margin-left: 20px;
    }
    #msg{
        color: red;
    }
    .terms{
        margin-top: 5px;
    }
</style>
<body>
    <header>
        <div class="logo"><a href="/index.html"><img src="assets/capture.PNG"></a></div>
        <nav>
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/signin.html">Sign In</a></li>
                <li><a href="/singup.html">Sign Up</a></li>
                <li><a href="/aboutvisit.html">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="first">
            <h1>Sign up to Game Maven</h1>
            <label for="user">Username</label>
            <input type="text" id="user">
            <label for="email">Email Address</label>
            <input type="email" id="email">
            <label for="pass">Password</label>
            <input type="password" id="pass">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm">
            <p class="terms"><input type="checkbox" id="agree" required><label for="agree">I agree to the terms and conditions</label</p>
            <p id="msg"></p>
            <button id="signin">SIGN UP</button>
            <p class="not">Already signed in? <span><a href="/signin.html" class="sign">Sign In</a></span></p>
        </div>
        <hr style="margin: 10px;">
    </main>
    <hr style="margin: 10px;">
    <footer">
      <p style="font-size: 12px; color: black; text-align: center;">© 2024, GameMaven, All Rights Reserved</p>
    </footer>
</body>
<script>
    const signBtn = document.querySelector("#signin");
    const msg = document.querySelector("#msg");

    signBtn.addEventListener("click", function(){
        const user = document.querySelector("#user").value;
        const pass = document.querySelector("#pass").value;
        const confirm = document.querySelector("#confirm").value
        const email = document.querySelector("#email").value

        if(user === "" || pass === "" || confirm === "" || email === ""){
            msg.innerHTML = "Complete the following.";
        } else if(!email.endsWith('@gmail.com')) {
            msg.innerHTML = "Please enter a valid Gmail address.";
        } else if(pass !== confirm) {
            msg.innerHTML = "Password and confirm password must match."
        } else if(!document.getElementById("agree").checked) {
            msg.innerHTML = "Please agree to the terms and conditions."
        } else {
            window.location.href = "/signin.html";
        }
    });
</script>
</html>
